name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          set +e +o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)
          echo "::notice title=sdkmanager::${SDKMANAGER:-not found}; platforms: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          # Accepting licences lets the Android Gradle plugin download anything still missing.
          yes 2>/dev/null | "$SDKMANAGER" --licenses > licences.log 2>&1
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" > sdk.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            msg=$(tail -25 sdk.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::warning title=sdkmanager exited $status (Gradle will try to install instead)::$msg"
          fi
          exit 0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew :core:model:test testDebugUnitTest assembleDebug --continue --stacktrace 2>&1 | tee gradle.log

      - name: Report build errors
        if: failure()
        run: bash .github/scripts/report-errors.sh gradle.log

      - name: Lint (report only)
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clippr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            gradle.log
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
